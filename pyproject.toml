[project]
name = "ai-sales-analytics-agent"
version = "0.1.0"
description = "AI-powered sales analytics agent using Claude, MCP, Python and PostgreSQL"
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "psycopg[binary]",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
py-modules = []
