services:
  postgres:
    image: postgres:16
    container_name: ai-sales-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_analytics
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: analytics_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
